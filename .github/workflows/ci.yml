name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check (catches syntax/import errors early)
        run: python -m compileall -q .

      - name: Lint (blocking on real errors only - undefined names, syntax)
        run: flake8 . --select=E9,F63,F7,F82 --exclude=migrations

      - name: Lint (style, informational only)
        continue-on-error: true
        run: flake8 . --max-line-length=120 --extend-ignore=E203,W503 --exclude=migrations

      - name: Run tests
        env:
          REDIS_URL: redis://localhost:6379/15
          SECRET_KEY: ci-test-secret
          JWT_SECRET_KEY: ci-test-jwt-secret
        run: pytest --cov=. --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t gokushield-backend:ci ./backend
